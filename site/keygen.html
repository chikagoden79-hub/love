<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Генератор ключей</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #ffe9f0; color: #7a2745; margin: 0; padding: 24px 16px; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 24px; }
  p { line-height: 1.5; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; background: #ff3f7d; color: #fff; padding: 12px 18px; cursor: pointer; }
  .item { background: #fff; border-radius: 14px; padding: 12px 14px; margin: 12px 0; }
  .item b { display: block; margin-bottom: 6px; font-family: ui-monospace, Consolas, monospace; }
  .item small { display: block; color: #a8607c; margin-bottom: 8px; }
  textarea { width: 100%; box-sizing: border-box; font: 14px ui-monospace, Consolas, monospace; border: 1px solid #f2a9c0; border-radius: 10px; padding: 8px; resize: none; }
  .copy { background: #fff; color: #ff3f7d; border: 1px solid #f2a9c0; padding: 6px 12px; margin-top: 6px; }
  .warn { background: #fff3cd; color: #6b4e00; border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<main>
  <h1>Генератор ключей 🔑</h1>
  <p>Ключи создаются прямо в этом браузере и никуда не отправляются. Сохраните их (например, в заметке или менеджере паролей), потом вставьте в секреты функции Supabase.</p>
  <button id="gen" type="button">Сгенерировать</button>
  <div id="out"></div>
  <p class="warn">После настройки удалите <b>keygen.html</b> из репозитория (он не секретный, просто больше не нужен).</p>
</main>
<script>
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
document.getElementById('gen').addEventListener('click', async () => {
  const out = document.getElementById('out');
  try {
    const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
    const pub = b64u(await crypto.subtle.exportKey('raw', kp.publicKey));
    const priv = (await crypto.subtle.exportKey('jwk', kp.privateKey)).d;
    const family = b64u(crypto.getRandomValues(new Uint8Array(24)));
    const items = [
      ['VAPID_PUBLIC_KEY', pub, 'секрет функции'],
      ['VAPID_PRIVATE_KEY', priv, 'секрет функции — никому не показывать'],
      ['FAMILY_KEY', family, 'секрет функции + вводится на каждом телефоне в ⚙︎ → «Ключ семьи»'],
    ];
    out.innerHTML = '';
    for (const [name, val, hint] of items) {
      const d = document.createElement('div'); d.className = 'item';
      d.innerHTML = `<b>${name}</b><small>${hint}</small>`;
      const ta = document.createElement('textarea'); ta.rows = 2; ta.readOnly = true; ta.value = val;
      const c = document.createElement('button'); c.className = 'copy'; c.type = 'button'; c.textContent = 'Копировать';
      c.onclick = async () => { ta.select(); try { await navigator.clipboard.writeText(val); } catch (e) { document.execCommand('copy'); } c.textContent = 'Скопировано ✓'; };
      d.append(ta, c); out.appendChild(d);
    }
  } catch (e) {
    out.innerHTML = '<p class="warn">Браузер не смог создать ключи: ' + e.message + '. Откройте эту страницу в Chrome или с вашего сайта на GitHub Pages.</p>';
  }
});
</script>
</body>
</html>
